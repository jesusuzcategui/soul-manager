name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Verify tag matches embedded VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file_version="$(tr -d '[:space:]' < internal/version/VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "Tag v$tag_version does not match internal/version/VERSION (=$file_version)" >&2
            exit 1
          fi

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev xorg-dev

      - name: Run tests
        run: go test ./...

      - name: Build Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/soul ./cmd/soul
          tar -C dist -czf dist/soul-linux-amd64.tar.gz soul

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Soul.app"
          mkdir -p "$app/Contents/MacOS"
          go build -trimpath -ldflags="-s -w" -o "$app/Contents/MacOS/Soul" ./cmd/soul
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Soul</string>
            <key>CFBundleExecutable</key><string>Soul</string>
            <key>CFBundleIdentifier</key><string>com.jesusuzcategui.soul</string>
            <key>CFBundleName</key><string>Soul</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
          </dict></plist>
          PLIST
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/soul-darwin-$arch.zip"

      - name: Build Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/soul.exe ./cmd/soul
          Compress-Archive -Path dist/soul.exe -DestinationPath dist/soul-windows-amd64.zip

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: soul-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: soul-*
          merge-multiple: true
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
